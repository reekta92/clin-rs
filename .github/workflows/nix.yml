name: Nix

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build --no-update-lock-file
      - name: Build and check the native package
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Check the development shell
        run: nix develop --no-update-lock-file --command cargo --version
