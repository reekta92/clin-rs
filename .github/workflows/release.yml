name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored for prerelease continuation/graduation or exact version)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: "Start or continue a pre-release"
        required: false
        type: boolean
        default: false
      prerelease_identifier:
        description: "Pre-release identifier (e.g., rc, beta, alpha)"
        required: false
        type: string
        default: rc
      override_version:
        description: "Exact, strictly newer semver; overrides bump and prerelease controls"
        required: false
        type: string
        default: ""
      target_branch:
        description: "Branch to base the release on"
        required: false
        type: string
        default: main
      dry_run:
        description: "Validate and build the candidate without pushing or publishing"
        required: false
        type: boolean
        default: false
      skip_gates:
        description: "Skip fmt/clippy/tests; package verification remains mandatory"
        required: false
        type: boolean
        default: false
      build_packages:
        description: "Build .deb and .rpm (x86_64 + aarch64)"
        required: false
        type: boolean
        default: true
      build_appimage:
        description: "Build x86_64 AppImage"
        required: false
        type: boolean
        default: true
      build_dmg:
        description: "Build DMG for macOS targets"
        required: false
        type: boolean
        default: true
      build_targets:
        description: "Which target set to build ('linux-only' = fast iteration)"
        required: true
        type: choice
        options: [all, linux-only]
        default: all
      publish_crates:
        description: "Publish to crates.io"
        required: false
        type: boolean
        default: true
      update_docs:
        description: "Post-release commit updating README/PKGBUILD artifact references"
        required: false
        type: boolean
        default: true
      create_discussion:
        description: "Create a release discussion"
        required: false
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    uses: reekta92/.github/.github/workflows/rust-release.yml@95f6218c96d14b0bd4b3b8b5c80e8a52bd60506f
    with:
      release_kind: application
      apt_deps: "libssl-dev pkg-config"
      BIN_NAME: "clin"
      PKG_PREFIX: "clin-rs"
      SMOKE_ARGS: "-h"
      bump: ${{ inputs.bump }}
      prerelease: ${{ inputs.prerelease }}
      prerelease_identifier: ${{ inputs.prerelease_identifier }}
      override_version: ${{ inputs.override_version }}
      target_branch: ${{ inputs.target_branch }}
      dry_run: ${{ inputs.dry_run }}
      skip_gates: ${{ inputs.skip_gates }}
      build_packages: ${{ inputs.build_packages }}
      build_appimage: ${{ inputs.build_appimage }}
      build_dmg: ${{ inputs.build_dmg }}
      build_targets: ${{ inputs.build_targets }}
      publish_crates: ${{ inputs.publish_crates }}
      update_docs: ${{ inputs.update_docs }}
      create_discussion: ${{ inputs.create_discussion }}
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
