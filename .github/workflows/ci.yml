name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  development-tools:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest discover -s .github/scripts -p 'test_check_*.py' -v

  ci:
    permissions:
      contents: read
    uses: reekta92/.github/.github/workflows/ci.yml@91cb0fbf33f0c10f1ed7fb5005e15882945a89a0
