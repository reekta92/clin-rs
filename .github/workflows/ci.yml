name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  development-tools:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest discover -s .github/scripts -p 'test_check_*.py' -v

  ci:
    permissions:
      contents: read
    uses: reekta92/.github/.github/workflows/ci.yml@11b8f0381eee881434f9febb4ced8bfd46a20dac
    with:
      test_runner: scripts/test_ci.py
      debug_info: line-tables-only
