name: Dispatch Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - pre-patch
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────
  # 1. Bump version, changelog, tag, push, create release
  # ────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install tools
        run: |
          cargo install cargo-edit --locked
          cargo install git-cliff --locked

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          BUMP_TYPE="${{ inputs.bump }}"

          case "$BUMP_TYPE" in
            patch)
              BASE=$(echo "$CURRENT" | cut -d'-' -f1)
              IFS='.' read -r MAJ MIN PAT <<< "$BASE"
              NEW="$MAJ.$MIN.$((PAT+1))"
              ;;
            minor)
              BASE=$(echo "$CURRENT" | cut -d'-' -f1)
              IFS='.' read -r MAJ MIN PAT <<< "$BASE"
              NEW="$MAJ.$((MIN+1)).0"
              ;;
            major)
              BASE=$(echo "$CURRENT" | cut -d'-' -f1)
              IFS='.' read -r MAJ MIN PAT <<< "$BASE"
              NEW="$((MAJ+1)).0.0"
              ;;
            pre-patch)
              if [[ "$CURRENT" =~ (.*-)([0-9]+)(.*) ]]; then
                PREFIX="${BASH_REMATCH[1]}"
                NUM="${BASH_REMATCH[2]}"
                SUFFIX="${BASH_REMATCH[3]}"
                NEW="${PREFIX}$((NUM+1))${SUFFIX}"
              else
                echo "::error::Current version $CURRENT has no pre-release component"
                exit 1
              fi
              ;;
          esac

          cargo set-version "$NEW"
          if [ -f flake.nix ]; then
            sed -i "s/version = \".*\"; # This will be updated by the release workflow/version = \"$NEW\"; # This will be updated by the release workflow/" flake.nix
          fi
          cargo generate-lockfile

          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Validate version
        run: |
          EXPECTED="${{ steps.bump.outputs.new_version }}"
          ACTUAL=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Version mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0)
          git cliff --tag "v${{ steps.bump.outputs.new_version }}" -o CHANGELOG.md
          git cliff "${PREV_TAG}..HEAD" --tag "v${{ steps.bump.outputs.new_version }}" -o RELEASE_NOTES.md

      - name: Commit, tag, push
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md flake.nix
          if ! git diff --staged --quiet; then
            git commit -m "release: $TAG"
          fi
          git tag "$TAG"
          git push --force-with-lease origin HEAD:main
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ steps.bump.outputs.new_version }}"
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --title "$TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --draft=false \
              --prerelease=${{ contains(steps.bump.outputs.new_version, '-') }}
          fi

  # ────────────────────────────────────────────
  # 2. Build Linux x86_64 binary
  # ────────────────────────────────────────────
  linux-x86_64:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/clin -h
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/clin .
          tar -cJf "dist/clin-rs-x86_64-unknown-linux-gnu.tar.xz" clin LICENSE README.md
          tar -czf "dist/clin-rs-x86_64-unknown-linux-gnu.tar.gz" clin LICENSE README.md
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" dist/* --clobber

  # ────────────────────────────────────────────
  # 3. Build Windows x86_64 binary
  # ────────────────────────────────────────────
  windows-x86_64:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        shell: bash
        run: ./target/release/clin.exe -h
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/clin.exe .
          7z a "dist/clin-rs-x86_64-pc-windows-msvc.zip" clin.exe LICENSE README.md
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber

  # ────────────────────────────────────────────
  # 4. Build macOS ARM (Apple Silicon) binary
  # ────────────────────────────────────────────
  macos-arm:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Smoke test
        run: ./target/aarch64-apple-darwin/release/clin -h
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/clin .
          tar -cJf "dist/clin-rs-aarch64-apple-darwin.tar.xz" clin LICENSE README.md
          tar -czf "dist/clin-rs-aarch64-apple-darwin.tar.gz" clin LICENSE README.md

          # Create DMG
          mkdir -p dmg_root
          cp clin LICENSE README.md dmg_root/
          hdiutil create -volname "clin" -srcfolder dmg_root -ov -format UDZO "dist/clin-rs-aarch64-apple-darwin.dmg"
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" dist/* --clobber

  # ────────────────────────────────────────────
  # 5. Build .deb and .rpm
  # ────────────────────────────────────────────
  linux-packages:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build packages
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" target/debian/*.deb target/generate-rpm/*.rpm --clobber

  # ────────────────────────────────────────────
  # 6. Build AppImage
  # ────────────────────────────────────────────
  appimage:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libfuse2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      - name: Build AppImage
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          export VERSION
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/clin \
            --desktop-file assets/clin.desktop \
            --icon-file assets/clin.png \
            --output appimage
          for f in clin*.AppImage; do
            [ "$f" = "clin-${VERSION}-x86_64.AppImage" ] || mv "$f" "clin-${VERSION}-x86_64.AppImage"
          done
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" clin-*-x86_64.AppImage --clobber


  # ────────────────────────────────────────────
  # 7. Build Nix package
  # ────────────────────────────────────────────
  nix:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build
        run: nix build .#default

  # ────────────────────────────────────────────
  # 8. Publish AUR package
  # ────────────────────────────────────────────
  aur:
    needs: [prepare, linux-packages, linux-x86_64]
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: |
          TIMEOUT=600; ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            TARBALL=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(contains("x86_64-unknown-linux-gnu") and endswith(".tar.xz"))][0]')
            [ -n "$TARBALL" ] && break
            sleep 15; ELAPSED=$((ELAPSED + 15))
          done
          if [ -z "$TARBALL" ]; then
            echo "::error::Linux tarball not found in release after ${TIMEOUT}s"; exit 1
          fi
      - name: Update PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
          VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          PKGVER=$(echo "$VERSION" | sed 's/-/_/g')
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          TARBALL_NAME=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(contains("x86_64-unknown-linux-gnu") and endswith(".tar.xz"))][0]')
          wget -q "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$TARBALL_NAME" -O tarball.tar.xz
          SHA=$(sha256sum tarball.tar.xz | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=(\"$SHA\")/" PKGBUILD
          sed -i "s|^source=.*|source=(\"${{ github.server_url }}/${{ github.repository }}/releases/download/v\${pkgver}/$TARBALL_NAME\")|" PKGBUILD
      - name: Publish to AUR
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: clin-rs-bin
          pkgbuild: ./PKGBUILD
          commit_username: "reekta92"
          commit_email: "mdag.92988@protonmail.com"
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.prepare.outputs.new_version }}"


  # ────────────────────────────────────────────
  # 9. Publish to crates.io
  # ────────────────────────────────────────────
  crates-io:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Publish
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked


  # ────────────────────────────────────────────
  # 10. Update README + PKGBUILD in main
  # ────────────────────────────────────────────
  post-release:
    needs: [prepare, linux-packages, appimage, linux-x86_64, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update artifact references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
          VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          TIMEOUT=300; ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            DEB_FILE=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith("_amd64.deb"))][0]')
            RPM_FILE=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".x86_64.rpm"))][0]')
            TAR_FILE=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(startswith("clin-rs") and contains("x86_64-unknown-linux-gnu") and endswith(".tar.gz"))][0]')
            [ -n "$DEB_FILE" ] && [ -n "$RPM_FILE" ] && [ -n "$TAR_FILE" ] && break
            sleep 15; ELAPSED=$((ELAPSED + 15))
          done
          if [ -n "$DEB_FILE" ]; then
            sed -i -E "s/clin-rs_[0-9a-zA-Z._-]*_amd64\.deb/$DEB_FILE/g" README.md
          fi
          if [ -n "$RPM_FILE" ]; then
            sed -i -E "s/clin-rs-[0-9a-zA-Z._-]*\.x86_64\.rpm/$RPM_FILE/g" README.md
          fi
          if [ -n "$TAR_FILE" ]; then
            sed -i -E "s/clin-rs-[0-9a-zA-Z._-]*x86_64[0-9a-zA-Z._-]*\.tar\.gz/$TAR_FILE/g" README.md
          fi
          PKGVER=$(echo "$VERSION" | sed 's/-/_/g')
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          TARBALL_NAME=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(contains("x86_64-unknown-linux-gnu") and endswith(".tar.xz"))][0]')
          if [ -n "$TARBALL_NAME" ]; then
            wget -q "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$TARBALL_NAME" -O tarball.tar.xz
            SHA=$(sha256sum tarball.tar.xz | cut -d' ' -f1)
            sed -i "s/^sha256sums=.*/sha256sums=(\"$SHA\")/" PKGBUILD
            sed -i "s|^source=.*|source=(\"${{ github.server_url }}/${{ github.repository }}/releases/download/v\${pkgver}/$TARBALL_NAME\")|" PKGBUILD
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md PKGBUILD flake.nix
          if ! git diff --staged --quiet; then
            git commit -m "release: update versions to v${{ needs.prepare.outputs.new_version }}"
            git push origin HEAD:main
          fi
