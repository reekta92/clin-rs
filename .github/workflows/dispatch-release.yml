name: Dispatch Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      target_branch:
        description: "The branch to base the release on"
        required: false
        type: string
        default: main
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false
      prerelease_identifier:
        description: "Pre-release identifier (e.g., rc, beta, alpha)"
        required: false
        type: string
        default: rc
      override_version:
        description: "Manually override the version number (e.g., 1.2.3-rc.0). If set, 'bump' is ignored."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────
  # 1. Calculate release version
  # ────────────────────────────────────────────
  calculate_version:
    name: Calculate Release Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.calculate.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}
      - name: Calculate next version
        id: calculate
        run: |
          OVERRIDE_VERSION="${{ inputs.override_version }}"
          if [ -n "$OVERRIDE_VERSION" ]; then
            NEW="$OVERRIDE_VERSION"
          else
            CURRENT=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
            BUMP_TYPE="${{ inputs.bump }}"
            PRERELEASE="${{ inputs.prerelease }}"
            PRE_ID="${{ inputs.prerelease_identifier }}"

            # Separate pre-release identifier and version if they exist
            CURRENT_BASE=$(echo "$CURRENT" | cut -d'-' -f1)
            CURRENT_PRE=$(echo "$CURRENT" | sed -n 's/^[0-9.]\+-\([^.]\+\).\([0-9]\+\)/\1/p')
            CURRENT_PRE_NUM=$(echo "$CURRENT" | sed -n 's/^[0-9.]\+-\([^.]\+\).\([0-9]\+\)/\2/p')

            IS_CURRENTLY_PRERELEASE=false
            if [ -n "$CURRENT_PRE" ]; then
              IS_CURRENTLY_PRERELEASE=true
            fi

            # Determine next base version from bump type
            IFS='.' read -r MAJ MIN PAT <<< "$CURRENT_BASE"
            case "$BUMP_TYPE" in
              patch) NEXT_BASE="$MAJ.$MIN.$((PAT+1))";;
              minor) NEXT_BASE="$MAJ.$((MIN+1)).0";;
              major) NEXT_BASE="$((MAJ+1)).0.0";;
            esac

            if [ "$PRERELEASE" = "true" ]; then
              # We want to end up with a pre-release
              if [ "$IS_CURRENTLY_PRERELEASE" = "true" ] && [ "$CURRENT_PRE" = "$PRE_ID" ]; then
                # Case 1: Incrementing existing pre-release (e.g., beta.0 -> beta.1)
                # Bump type is ignored. Base version is kept.
                NEW="$CURRENT_BASE-$PRE_ID.$((CURRENT_PRE_NUM+1))"
              else
                # Case 2: Starting a new pre-release series (e.g., 1.2.3 -> 1.2.4-rc.0)
                # Bump type is used.
                NEW="$NEXT_BASE-$PRE_ID.0"
              fi
            else
              # We want to end up with a stable release
              if [ "$IS_CURRENTLY_PRERELEASE" = "true" ]; then
                # Case 3: Graduating a pre-release (e.g., 1.2.3-rc.1 -> 1.2.3)
                # Bump type is ignored. Base version is kept.
                NEW="$CURRENT_BASE"
              else
                # Case 4: Standard stable bump (e.g., 1.2.3 -> 1.2.4)
                # Bump type is used.
                NEW="$NEXT_BASE"
              fi
            fi
          fi
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release Version Preview::Calculated new version is $NEW. Approve to proceed."
      - name: Save release metadata for cleanup
        run: |
          OLD_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          NEW_VERSION="${{ steps.calculate.outputs.new_version }}"
          jq -n \
            --arg old "$OLD_VERSION" \
            --arg new "$NEW_VERSION" \
            --arg tag "v$NEW_VERSION" \
            --arg branch "${{ inputs.target_branch }}" \
            '{old_version: $old, new_version: $new, tag: $tag, target_branch: $branch}' \
            > release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata.json
          retention-days: 3

  # ────────────────────────────────────────────
  # 2. Approve the release
  # ────────────────────────────────────────────
  approval:
    name: Approve Release
    needs: calculate_version
    runs-on: ubuntu-latest
    # This environment needs to be created in the repository settings.
    # It should be configured with "Required reviewers" to enable the approval gate.
    environment:
      name: release-approval
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Waiting for approval
        run: |
          echo "Please review the version calculated in the 'Calculate Release Version' job."
          echo "Version to be released: ${{ needs.calculate_version.outputs.new_version }}"
          echo "Approve this step to continue with the release."
  # ────────────────────────────────────────────
  # 3. Bump version, changelog, tag, push, create release
  # ────────────────────────────────────────────
  prepare:
    needs: [calculate_version, approval]
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ needs.calculate_version.outputs.new_version }}
      tag: v${{ needs.calculate_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.target_branch }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install tools
        run: |
          cargo install cargo-edit --locked
          cargo install git-cliff --locked

      - name: Set version
        id: bump
        run: |
          NEW="${{ needs.calculate_version.outputs.new_version }}"
          cargo set-version "$NEW"
          if [ -f flake.nix ]; then
            sed -i "s/version = \".*\"; # This will be updated by the release workflow/version = \"$NEW\"; # This will be updated by the release workflow/" flake.nix
          fi
          cargo generate-lockfile

          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Validate version
        run: |
          EXPECTED="${{ steps.bump.outputs.new_version }}"
          ACTUAL=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Version mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0)
          git cliff --tag "v${{ steps.bump.outputs.new_version }}" -o CHANGELOG.md
          git cliff "${PREV_TAG}..HEAD" --tag "v${{ steps.bump.outputs.new_version }}" -o RELEASE_NOTES.md

      - name: Commit, tag, push
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md flake.nix
          if ! git diff --staged --quiet; then
            git commit -m "release: $TAG"
          fi
          git tag "$TAG"
          git push --force-with-lease origin HEAD:${{ inputs.target_branch }}
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ steps.bump.outputs.new_version }}"
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --title "$TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --draft \
              --prerelease=${{ inputs.prerelease }}
          fi

  # ────────────────────────────────────────────
  # 4. Build Linux x86_64 binary
  # ────────────────────────────────────────────
  linux-x86_64:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/clin -h
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/clin .
          tar -cJf "dist/clin-rs-x86_64-unknown-linux-gnu.tar.xz" clin LICENSE README.md
          tar -czf "dist/clin-rs-x86_64-unknown-linux-gnu.tar.gz" clin LICENSE README.md
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" dist/* --clobber
  # ────────────────────────────────────────────
  # 5. Build Linux aarch64 binary
  # ────────────────────────────────────────────
  linux-aarch64:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross deps
        run: |
          sudo dpkg --add-architecture arm64
          # Pin .list files to amd64 (skip lines that already have arch restriction)
          sudo find /etc/apt/ -name '*.list' -exec sed -i '/^deb /{/\[arch=/!s/^deb /deb [arch=amd64] /}' {} +
          # Pin .sources files to amd64 (skip if file already has Architectures: set)
          sudo find /etc/apt/ -name '*.sources' -exec sh -c '
            grep -q "^Architectures:" "$1" 2>/dev/null || \
              sed -i "/^Types: deb/a Architectures: amd64" "$1"
          ' _ {} \;
          # Add arm64 repos from ports.ubuntu.com (official Ubuntu archive for non-x86 architectures)
          printf '%s\n' \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" \
            | sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Build
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
      - name: Verify binary architecture
        run: |
          readelf -h target/aarch64-unknown-linux-gnu/release/clin | grep -q "AArch64" && \
          echo "Binary is ARM64 (AArch64)" && \
          file target/aarch64-unknown-linux-gnu/release/clin
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/clin .
          tar -cJf "dist/clin-rs-aarch64-unknown-linux-gnu.tar.xz" clin LICENSE README.md
          tar -czf "dist/clin-rs-aarch64-unknown-linux-gnu.tar.gz" clin LICENSE README.md
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" dist/* --clobber
  # 5. Build Windows x86_64 binary
  # 6. Build Windows x86_64 binary
  windows-x86_64:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        shell: bash
        run: ./target/release/clin.exe -h
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/clin.exe .
          7z a "dist/clin-rs-x86_64-pc-windows-msvc.zip" clin.exe LICENSE README.md
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber

  # 6. Build macOS ARM (Apple Silicon) binary
  # 7. Build macOS ARM (Apple Silicon) binary
  macos-arm:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Smoke test
        run: ./target/aarch64-apple-darwin/release/clin -h
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/clin .
          tar -cJf "dist/clin-rs-aarch64-apple-darwin.tar.xz" clin LICENSE README.md
          tar -czf "dist/clin-rs-aarch64-apple-darwin.tar.gz" clin LICENSE README.md

          # Create DMG
          mkdir -p dmg_root
          cp clin LICENSE README.md dmg_root/
          hdiutil create -volname "clin" -srcfolder dmg_root -ov -format UDZO "dist/clin-rs-aarch64-apple-darwin.dmg"
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" dist/* --clobber

  # 7. Build .deb and .rpm
  # 8. Build .deb and .rpm
  linux-packages:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$VERSION" == *"-"* ]]; then
            SAFE_VERSION=$(echo "$VERSION" | sed 's/-/~/g')
            cargo deb --no-build --deb-version "$SAFE_VERSION"
            cargo generate-rpm --set-metadata "version = '$SAFE_VERSION'"
          else
            cargo deb --no-build
            cargo generate-rpm
          fi
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" target/debian/*.deb target/generate-rpm/*.rpm --clobber
  # ────────────────────────────────────────────
  # 9. Build .deb and .rpm (aarch64)
  # ────────────────────────────────────────────
  linux-packages-aarch64:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross deps
        run: |
          sudo dpkg --add-architecture arm64
          # Pin .list files to amd64 (skip lines that already have arch restriction)
          sudo find /etc/apt/ -name '*.list' -exec sed -i '/^deb /{/\[arch=/!s/^deb /deb [arch=amd64] /}' {} +
          # Pin .sources files to amd64 (skip if file already has Architectures: set)
          sudo find /etc/apt/ -name '*.sources' -exec sh -c '
            grep -q "^Architectures:" "$1" 2>/dev/null || \
              sed -i "/^Types: deb/a Architectures: amd64" "$1"
          ' _ {} \;
          # Add arm64 repos from ports.ubuntu.com (official Ubuntu archive for non-x86 architectures)
          printf '%s\n' \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" \
            | sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Build release binary
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
      - name: Build packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$VERSION" == *"-"* ]]; then
            SAFE_VERSION=$(echo "$VERSION" | sed 's/-/~/g')
            cargo deb --no-build --target aarch64-unknown-linux-gnu --deb-version "$SAFE_VERSION"
            cargo generate-rpm --target aarch64-unknown-linux-gnu --set-metadata "version = '$SAFE_VERSION'"
          else
            cargo deb --no-build --target aarch64-unknown-linux-gnu
            cargo generate-rpm --target aarch64-unknown-linux-gnu
          fi
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" target/debian/*.deb target/aarch64-unknown-linux-gnu/generate-rpm/*.rpm --clobber

  # ────────────────────────────────────────────
  # 10. Build AppImage
  # ────────────────────────────────────────────
  appimage:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libfuse2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      - name: Build AppImage
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          export VERSION
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/clin \
            --desktop-file assets/clin.desktop \
            --icon-file assets/clin.png \
            --output appimage
          for f in clin*.AppImage; do
            [ "$f" = "clin-${VERSION}-x86_64.AppImage" ] || mv "$f" "clin-${VERSION}-x86_64.AppImage"
          done
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: gh release upload "$TAG" clin-*-x86_64.AppImage --clobber


  # ────────────────────────────────────────────
  # 11. Build Nix package
  # ────────────────────────────────────────────
  nix:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build
        run: nix build .#default

  # ────────────────────────────────────────────
  # 12. Publish AUR package
  # ────────────────────────────────────────────
  aur:
    needs: [prepare, linux-packages, linux-x86_64]
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: |
          TIMEOUT=600; ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            TARBALL=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(contains("x86_64-unknown-linux-gnu") and endswith(".tar.xz"))][0]')
            [ -n "$TARBALL" ] && break
            sleep 15; ELAPSED=$((ELAPSED + 15))
          done
          if [ -z "$TARBALL" ]; then
            echo "::error::Linux tarball not found in release after ${TIMEOUT}s"; exit 1
          fi
      - name: Update PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
          VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          PKGVER=$(echo "$VERSION" | sed 's/-/_/g')
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          TARBALL_NAME=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(contains("x86_64-unknown-linux-gnu") and endswith(".tar.xz"))][0]')
          gh release download "$TAG" --pattern "$TARBALL_NAME" --output tarball.tar.xz
          SHA=$(sha256sum tarball.tar.xz | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=(\"$SHA\")/" PKGBUILD
          sed -i "s|^source=.*|source=(\"${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$TARBALL_NAME\")|" PKGBUILD
      - name: Publish to AUR
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: clin-rs-bin
          pkgbuild: ./PKGBUILD
          commit_username: "reekta92"
          commit_email: "mdag.92988@protonmail.com"
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.prepare.outputs.new_version }}"


  # ────────────────────────────────────────────
  # 13. Publish to crates.io
  # ────────────────────────────────────────────
  crates-io:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.new_version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Publish
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked


  # ────────────────────────────────────────────
  # 14. Update README + PKGBUILD in target branch
  # ────────────────────────────────────────────
  post-release:
    needs: [prepare, linux-packages, linux-packages-aarch64, appimage, linux-x86_64, linux-aarch64, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update artifact references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
          VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          TIMEOUT=300; ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            DEB_FILE=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith("_amd64.deb"))][0]')
            RPM_FILE=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".x86_64.rpm"))][0]')
            TAR_FILE=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(startswith("clin-rs") and contains("x86_64-unknown-linux-gnu") and endswith(".tar.gz"))][0]')
            [ -n "$DEB_FILE" ] && [ -n "$RPM_FILE" ] && [ -n "$TAR_FILE" ] && break
            sleep 15; ELAPSED=$((ELAPSED + 15))
          done
          if [ -n "$DEB_FILE" ]; then
            sed -i -E "s/clin-rs_[0-9a-zA-Z._~-]*_amd64\.deb/$DEB_FILE/g" README.md
          fi
          if [ -n "$RPM_FILE" ]; then
            sed -i -E "s/clin-rs-[0-9a-zA-Z._~-]*\.x86_64\.rpm/$RPM_FILE/g" README.md
          fi
          if [ -n "$TAR_FILE" ]; then
            sed -i -E "s/clin-rs-[0-9a-zA-Z._~-]*x86_64[0-9a-zA-Z._~-]*\.tar\.gz/$TAR_FILE/g" README.md
          fi
          # Also update aarch64 references in README.md
          DEB_ARM64=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith("_arm64.deb"))][0]')
          RPM_AARCH64=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".aarch64.rpm"))][0]')
          TAR_AARCH64=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith("aarch64-unknown-linux-gnu.tar.gz"))][0]')
          if [ -n "$DEB_ARM64" ]; then
            sed -i -E "s/clin-rs_[0-9a-zA-Z._~-]*_arm64\.deb/$DEB_ARM64/g" README.md
          fi
          if [ -n "$RPM_AARCH64" ]; then
            sed -i -E "s/clin-rs-[0-9a-zA-Z._~-]*\.aarch64\.rpm/$RPM_AARCH64/g" README.md
          fi
          if [ -n "$TAR_AARCH64" ]; then
            sed -i -E "s/clin-rs-[0-9a-zA-Z._~-]*aarch64[0-9a-zA-Z._~-]*\.tar\.gz/$TAR_AARCH64/g" README.md
          fi
          PKGVER=$(echo "$VERSION" | sed 's/-/_/g')
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          TARBALL_NAME=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(contains("x86_64-unknown-linux-gnu") and endswith(".tar.xz"))][0]')
          if [ -n "$TARBALL_NAME" ]; then
            gh release download "$TAG" --pattern "$TARBALL_NAME" --output tarball.tar.xz
            SHA=$(sha256sum tarball.tar.xz | cut -d' ' -f1)
            sed -i "s/^sha256sums=.*/sha256sums=(\"$SHA\")/" PKGBUILD
            sed -i "s|^source=.*|source=(\"${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$TARBALL_NAME\")|" PKGBUILD
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md PKGBUILD flake.nix
          if ! git diff --staged --quiet; then
            git commit -m "release: update versions to v${{ needs.prepare.outputs.new_version }}"
            git push origin HEAD:${{ inputs.target_branch }}
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.prepare.outputs.new_version }}"
        run: |
          gh release edit "$TAG" --draft=false || echo "Warning: could not publish release $TAG"
  # ────────────────────────────────────────────
  # 15. Cleanup on failure
  # ────────────────────────────────────────────
  cleanup-on-failure:
    if: ${{ failure() }}
    needs: [calculate_version, prepare, linux-x86_64, linux-aarch64, windows-x86_64, macos-arm, linux-packages, linux-packages-aarch64, appimage, nix, aur, crates-io, post-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - name: Read metadata
        id: metadata
        run: |
          if [ ! -f release-metadata.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "content=$(cat release-metadata.json | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Revert release (delete release, tag, undo version commit)
        if: ${{ steps.metadata.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ fromJSON(steps.metadata.outputs.content).tag }}"
          BRANCH="${{ fromJSON(steps.metadata.outputs.content).target_branch }}"

          echo "::group::Delete release $TAG"
          gh release delete "$TAG" --yes 2>/dev/null && echo "Deleted release $TAG" \
            || echo "Release $TAG not found (OK)"
          echo "::endgroup::"

          echo "::group::Delete tag $TAG"
          git push origin --delete "$TAG" 2>/dev/null && echo "Deleted tag $TAG" \
            || echo "Tag $TAG not found (OK)"
          echo "::endgroup::"

          echo "::group::Revert commits on $BRANCH"
          git fetch origin "$BRANCH" 2>/dev/null || {
            echo "Branch $BRANCH not found, skipping revert"
            echo "::endgroup::"
            exit 0
          }
          git checkout "origin/$BRANCH" --detach

          # Find release commit (matches "release: vX.Y.Z" but NOT "release: update versions to vX.Y.Z")
          RELEASE_COMMIT=$(git log --oneline --grep="^release: v[0-9]" --format="%H" -1)

          REVERT_COUNT=0
          if [ -n "$RELEASE_COMMIT" ]; then
            echo "Reverting release commit $RELEASE_COMMIT..."
            if git revert --no-edit "$RELEASE_COMMIT" 2>/dev/null; then
              REVERT_COUNT=$((REVERT_COUNT + 1))
            elif git revert --no-edit -X theirs "$RELEASE_COMMIT" 2>/dev/null; then
              echo "Revert completed with theirs strategy (conflicts auto-resolved)"
              REVERT_COUNT=$((REVERT_COUNT + 1))
            else
              echo "WARNING: Could not revert $RELEASE_COMMIT even with theirs strategy. Manual cleanup needed."
              echo "tag=$TAG old_version=$(cat release-metadata.json | jq -r '.old_version')"
            fi
          fi

          if [ "$REVERT_COUNT" -gt 0 ]; then
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed $REVERT_COUNT revert commit(s) to $BRANCH"
            else
              echo "WARNING: Revert commit created locally but push failed."
              echo "  To push manually: git push origin HEAD:$BRANCH"
            fi
          else
            echo "No commits to revert"
          fi
          echo "::endgroup::"
