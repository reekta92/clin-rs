[package]
name = "clin-tauri"
version = "0.1.0"
edition = "2021"
description = "clin desktop companion — a native wrapper around the clin markdown vault"
authors = []
license = "MIT"

[lib]
name = "clin_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clin-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell           = "2"
tauri-plugin-dialog          = "2"      # native file/folder picker dialogs
tauri-plugin-notification    = "2"      # OS notifications (sync done, errors)
tauri-plugin-global-shortcut = "2"      # global hotkey to show/hide window
tauri-plugin-window-state    = "2"      # persist window size + position
tauri-plugin-clipboard-manager = "2"    # copy note as markdown/html
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
walkdir      = "2"
comrak       = { version = "0.28", default-features = false, features = ["shortcodes"] }
gray_matter  = "0.2"
anyhow       = "1"
regex        = "1"
dirs         = "5"
chrono       = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
strip     = true
lto       = true
codegen-units = 1
panic     = "abort"
