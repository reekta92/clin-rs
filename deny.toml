[graph]
all-features = true

[advisories]
# Fail CI if a dependency version has been yanked from crates.io.
yanked = "deny"
# No blanket ignores; every advisory must be resolved by upgrading.
ignore = [
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2017-0008", # serial unmaintained
]
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "NCSA",
    # The clin-rs package itself is GPL-3.0-only (Cargo.toml license field).
    "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
deny = []
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
