[package]
name = "clin-rs"
version = "0.14.0-rc.0"
edition = "2024"
rust-version = "1.90.0"
description = "Feature-packed terminal note management app inspired by Obsidian"
authors = ["reekta92 <mdag.92988@protonmail.com>"]
repository = "https://github.com/reekta92/clin-rs"
homepage = "https://github.com/reekta92/clin-rs"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["tui", "notes", "obsidian", "markdown", "terminal"]
categories = ["command-line-utilities", "text-editors"]
exclude = ["assets/*", "docs/*", "examples/*", "dev_scripts/*", "PKGBUILD", ".github/*"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
assigning_clones = "allow"
float_cmp = "allow"
bool_to_int_with_if = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
format_push_string = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
inconsistent_struct_constructor = "allow"
items_after_statements = "allow"
manual_midpoint = "allow"
manual_let_else = "allow"
manual_string_new = "allow"
manual_is_variant_and = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
needless_continue = "allow"
needless_raw_string_hashes = "allow"
non_std_lazy_statics = "allow"
range_plus_one = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
[lib]
name = "clin"

[[bin]]
name = "clin"
path = "src/bin/clin.rs"
[package.metadata.deb]
name = "clin-rs"
maintainer = "reekta <reekta@localhost>"
copyright = "2026, reekta"
depends = "libc6 (>= 2.31)"
section = "utils"
priority = "optional"
assets = [
	["target/release/clin", "usr/bin/clin", "755"],
	["assets/clin.desktop", "usr/share/applications/clin.desktop", "644"],
	["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/clin.svg", "644"],
	["assets/clin.png", "usr/share/icons/hicolor/256x256/apps/clin.png", "644"],
]
extended-description = "clin-rs is a terminal-first Markdown note app with in-app editing and mouse support."

[package.metadata.generate-rpm]
name = "clin-rs"
assets = [
	{ source = "target/release/clin", dest = "/usr/bin/clin", mode = "0755" },
	{ source = "assets/clin.desktop", dest = "/usr/share/applications/clin.desktop", mode = "0644" },
	{ source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/clin.svg", mode = "0644" },
	{ source = "assets/clin.png", dest = "/usr/share/icons/hicolor/256x256/apps/clin.png", mode = "0644" },
]

[dependencies]
draw = { package = "draw-rs", version = "0.1.2" }
anyhow = "1.0"
base64 = "0.22"
arboard = "3.6.1"
bincode = { version = "2.0", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
icalendar = { version = "0.17.15", features = ["recurrence"] }
iso8601 = "0.6"
csv = "1.3"
crossterm = "0.29"
directories = "5.0"
fuzzy-matcher = "0.3.7"
lru = "0.18.1"
image = "0.25.10"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
rand = "0.10"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
graf = { package = "graf-rs", version = "1.1.0" }
pinstar = { version = "1.1.2", features = ["images", "mermaid-preview"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
# Keep existing imports while using YAML Organization's maintained backend.
serde_yaml_ng = { package = "yaml_serde", version = "=0.10.7" }
signal-hook = "0.4"
parking_lot = "0.12"
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
trash = "5"
ratatui-textarea = { version = "0.9", features = ["search"] }
uuid = { version = "1.8", features = ["v4"] }
fdg-sim = "0.9"
comrak = { version = "0.56", default-features = false }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
notify = "8.2.0"
same-file = "1"
sha2 = "0.10.9"
rayon = "1.12"
regex = "1"
quick-xml = "0.41"
ryu-js = "1.0.3"
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }
strum = { version = "0.28", features = ["derive"] }
yaml-edit = { version = "0.3.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

