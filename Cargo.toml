[package]
name = "clin-rs"
version = "0.9.2"
edition = "2024"
rust-version = "1.88.0"
description = "Feature-packed terminal note management app inspired by Obsidian"
authors = ["reekta92 <mdag.92988@protonmail.com>"]
repository = "https://github.com/reekta92/clin-rs"
homepage = "https://github.com/reekta92/clin-rs"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["tui", "notes", "obsidian", "encryption", "terminal"]
categories = ["command-line-utilities", "text-editors"]
exclude = ["assets/*", "docs/*", "examples/*", "dev_scripts/*", "PKGBUILD", "clin.ico", ".github/*"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
assigning_clones = "allow"
float_cmp = "allow"
bool_to_int_with_if = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
format_push_string = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
inconsistent_struct_constructor = "allow"
items_after_statements = "allow"
manual_midpoint = "allow"
manual_let_else = "allow"
manual_string_new = "allow"
manual_is_variant_and = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
needless_continue = "allow"
needless_raw_string_hashes = "allow"
non_std_lazy_statics = "allow"
range_plus_one = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
[lib]
name = "clin"

[[bin]]
name = "clin"
path = "src/bin/clin.rs"
[package.metadata.deb]
name = "clin-rs"
maintainer = "reekta <reekta@localhost>"
copyright = "2026, reekta"
depends = "libc6 (>= 2.31), libssl3 | libssl1.1"
section = "utils"
priority = "optional"
assets = [
	["target/release/clin", "usr/bin/clin", "755"],
	["clin.ico", "usr/share/pixmaps/clin.ico", "644"],
]
extended-description = "clin-rs is a terminal-first encrypted note app with in-app editing and mouse support."

[package.metadata.generate-rpm]
name = "clin-rs"
assets = [
	{ source = "target/release/clin", dest = "/usr/bin/clin", mode = "0755" },
	{ source = "clin.ico", dest = "/usr/share/pixmaps/clin.ico", mode = "0644" },
]

[dependencies]
anyhow = "1.0"
arboard = "3.6.1"
bincode = { version = "2.0", features = ["serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
csv = "1.3"
crossterm = "0.29"
directories = "5.0"
fuzzy-matcher = "0.3.7"
image = "0.25.10"
 rand = "0.8"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
signal-hook = "0.4"
parking_lot = "0.12"
tempfile = "3.27.0"
toml = "1.1"
toml_edit = "0.25"
trash = "5"
ratatui-textarea = "0.9"
uuid = { version = "1.8", features = ["v4"] }
fdg-sim = "0.9"
which = "8.0.2"
comrak = { version = "0.36", default-features = false }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
zeroize = { version = "1.8.2", features = ["derive"] }
unicode-width = "0.2"
git2 = "0.21"
mimalloc = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

