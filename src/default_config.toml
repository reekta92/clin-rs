# clin configuration
# See https://github.com/clin-notes/clin for full documentation

# Storage path — custom directory for notes data.
# If unset, uses the platform default:
#   Linux:   ~/.local/share/clin
#   macOS:   ~/Library/Application Support/com.clin.clin
#   Windows: C:\Users\<user>\AppData\Local\clin\clin
# storage_path = "/absolute/path/to/notes"

# External editor command (e.g. "code --wait", "nano", "vim").
# Falls back to $VISUAL then $EDITOR if unset.
# external_editor = "code --wait"

# Enable external editor on open (default: false).
external_editor_enabled = false

# Enable inline preview pane in list view (default: true).
preview_enabled = true

# Enable markdown preview in edit view (default: false).
editor_preview_enabled = false

[theme]
# Theme name: default, tokyonight, catppuccin_mocha, onedark, gruvbox,
#             dracula, nord, rosepine, everforest, kanagawa, solarized
theme = "default"
# Background style: "transparent" or "solid"
background = "transparent"

# Individual color overrides (hex format, optional)
# accent = "#00ffff"
# heading = "#ffff00"
# success = "#00ff00"
# destructive = "#ff0000"
# muted = "#888888"
# text = "#ffffff"
# border = "#444444"
# tag = "#ff88ff"
# folder = "#4488ff"
# background_color = "#111122"

[visual]
graph_background = "transparent"
node_color_mode = "folder"
edge_color_mode = "uniform"
label_mode = "selected"
label_max_length = 20
node_size = 2.0
node_size_mode = "fixed"
edge_thickness = 1
show_legend = true
show_grid = false
show_minimap = false
minimap_position = "top_right"
minimap_width = 24
minimap_height = 12
canvas_marker = "braille"
node_shape = "circle"
label_offset = 4.0
grid_divisions = 10

[visual.colors]
# node_color = "#ff6600"
# edge_color = "#445566"
# label_color = "#aabbcc"
# selection_ring_color = "#ff00ff"
# border_color = "#334455"
# title_color = "#66ffcc"
# grid_color = "#222233"
# legend_text_color = "#ccddee"
# status_bar_color = "#556677"
# background_color = "#1a1a2e"

